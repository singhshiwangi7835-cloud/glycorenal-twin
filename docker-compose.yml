# Start everything:  docker compose up --build
#   API docs   http://localhost:8000/docs
#   App        http://localhost:8501   (login page; demo accounts in the "Demo accounts" box)
services:
  api:
    build: .
    image: glycorenal-twin:latest
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - twin-data:/app/data/db
    environment:
      DATABASE_URL: sqlite:////app/data/db/twin.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    image: glycorenal-twin:latest
    command: streamlit run app/Home.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  twin-data:
