# Design: logo navy accent, warm off-white background (KDIGO colours are used only for risk)
[theme]
base = "light"
primaryColor = "#1C3C5F"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#EFEDE7"
textColor = "#13212A"
baseRadius = "8px"

[theme.sidebar]
backgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
